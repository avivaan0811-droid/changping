html.aih-room-arriving::after, html.aih-room-ready::after, html.aih-room-leaving::after {
  content:"";
  position:fixed;
  inset:0;
  z-index:2147483647;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:opacity 1000ms ease-in-out;
}
html.aih-room-arriving::after, html.aih-room-leaving::after {
  opacity:1;
  pointer-events:auto;
}
html.aih-room-arriving::after { transition:none; }

<script>
(() => {
  const root = document.documentElement;
  const arriving = new URLSearchParams(location.search).get('sceneFade') === '1';
  let leaving = false;
  if (arriving) {
    root.classList.add('aih-room-arriving');
    document.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        root.classList.replace('aih-room-arriving', 'aih-room-ready');
      }));
    }, { once:true });
  }

  const audioOutputs = new Map();
  function fadeAudio(target) {
    for (const [context, output] of audioOutputs) {
      const now = context.currentTime;
      output.gain.cancelAndHoldAtTime(now);
      output.gain.linearRampToValueAtTime(target, now + 1);
    }
  }

  window.aihSceneTransition = {
    audioOutput(context) {
      if (!audioOutputs.has(context)) {
        const output = context.createGain();
        output.gain.value = 0;
        output.connect(context.destination);
        if (!leaving) output.gain.linearRampToValueAtTime(1, context.currentTime + 1);
        audioOutputs.set(context, output);
      }
      return audioOutputs.get(context);
    },
    go(destination) {
      if (leaving) return;
      const next = new URL(destination, location.href);
      next.searchParams.set('sceneFade', '1');
      leaving = true;
      fadeAudio(0);
      root.classList.add('aih-room-ready');
      getComputedStyle(root, '::after').opacity;
      root.classList.add('aih-room-leaving');
      setTimeout(() => location.assign(next.href), 1000);
    }
  };

  window.addEventListener('pageshow', event => {
    if (!event.persisted) return;
    leaving = false;
    fadeAudio(1);
    root.classList.remove('aih-room-leaving');
  });
})();
</script>

<script>const T=(zh,en)=>({zh,en});
const memory=[T('在庵裡，有個孩子來討粥。師父沒有先問他是誰家的孩子，只把碗接過去，添滿了。','At the convent, a child came asking for porridge. The nun did not ask whose child it was. She took the bowl and filled it.'),T('那時我才想，原來一個人不必先有個尊貴的名字，才值得被好好照看。','Only then did I realize: a person does not need a noble name to deserve care.')];
const reconcileIntro={submit:T('父皇的安葬有了著落，弟弟也能出來了。可是，世顯，我還不知道，往後的日子該怎麼過。','My father can be laid to rest, and my brother can be released. But Shixian, I still do not know how to live the days ahead.'),refuse:T('父皇的安葬、弟弟的下落，都還沒有著落。我放不下，也不能假裝已經放下。','My father has not yet been laid to rest. My brother’s fate is still unknown. I cannot let go, and I cannot pretend that I have.')};
const reconcileCommon=[['長平',T('世顯，我從前讀詩，讀到喜歡的一句，總要再讀一遍。','Shixian, when I used to read poetry, I would always read a favorite line once more.')],['長平',T('如今有些字，讀著讀著就看不清了。可我還想把那一頁讀完。','Now some words grow blurred as I read. But I still want to finish that page.')],['長平',T('我的繡繃上，還留著半朵花。往後也許繡得慢些……你替我把布壓住，好不好？','There is still half a flower on my embroidery hoop. I may stitch more slowly now… Will you hold the cloth steady for me?')],['周世顯',T('好。慢慢來。','Of course. Take your time.')],['長平',T('還有，我想與你吃一頓熱飯。不必有人候著，也不必趕著去哪兒。等湯不燙了，我們再吃。','And I want to share a warm meal with you. No one waiting on us. Nowhere we have to hurry to. We can eat once the soup has cooled.')],['長平',T('我捨不得的，原來還有這些。','These, too, are things I cannot bear to lose.')],['長平',T('在庵裡，花落了，師父便掃到樹根下。第二日，還是照常給樹澆水。','At the convent, the nun swept fallen flowers back to the roots. The next day, she watered the tree as usual.')],['長平',T('我那時只看著地上的花。如今，我也想看看枝頭。','Back then, I only looked at the flowers on the ground. Now I want to look up at the branches, too.')],['落幕旁白',T('那半朵花，還沒有繡完。她把繡繃留下，等明日的光。','The half-finished flower is still waiting. She leaves her embroidery hoop there, ready for tomorrow’s light.')]];
const narratives={leave:{submit:T('請求換來了離開的機會。你與世顯走出宮門，仍記得自己曾經是誰，也開始學習只做一個普通人。','The petition has opened a chance to leave. You and Shixian walk out of the palace gates, remembering who you were and learning to live as ordinary people.'),refuse:T('你沒有遞出那封表。親人的消息仍懸而未決，你與世顯遠行，也把尋找答案的責任帶在身邊。','You never submitted the petition. Your family’s fate remains unresolved. You and Shixian leave, carrying the responsibility to keep searching.')},resist:{submit:T('你收回了已經作出的承諾。弟弟獲得自由，你們離開宮門；接下來的路沒有勝利保證，只有你願意承擔的後果。','You withdraw the promise you made. Your brother has gained his freedom, and you leave the palace gates. The road ahead offers no guarantee of victory—only consequences you choose to face.'),refuse:T('那封表從未遞出。弟弟仍未脫困，你與世顯踏上尋找和營救的路。故事繼續，但結果仍未知。','The petition was never sent. Your brother is still captive. You and Shixian begin a journey to find and rescue him. The story continues; its outcome remains unknown.')}};
const closings={leave:T('你放下的是一個身份，不是所有記憶。','You leave an identity behind, not all your memories.'),resist:T('堅持，不是必勝；是知道代價以後，仍然選擇繼續。','Persistence is not certain victory. It is choosing to continue after recognizing the cost.')};
const leaveBeats=[
 ['長平',T('世顯，這道門我走過許多回。從前，每一次都有人替我報名字。','Shixian, I have passed this gate many times. Before, someone always announced my name.')],
 ['周世顯',T('這一次，先看腳下。門檻高，我在這裡。','This time, watch your step. The threshold is high. I am here.')],
 ['長平',T('我帶不走整座宮城。那一頁詩、半朵花，還有沒有問到的消息，我都記著。','I cannot carry the whole palace with me. But I remember that page of poetry, the unfinished flower, and the news I have yet to find.')],
 ['周世顯',T('到了前面的鎮上，先找一處能歇腳的地方。你想問的消息，我們一處一處地問。','At the next town, we will find somewhere to rest. Then we will ask for the news you need, one place at a time.')],
 ['長平',T('好。等鞋上的泥乾了，我還想把那半朵花繡完。','Yes. Once the mud on my shoes has dried, I still want to finish that flower.')],
 ['落幕旁白',T('門在身後。她沒有失去名字，只是不再等別人替她喊出來。','The gate is behind her. She has not lost her name. She simply no longer waits for someone else to announce it.')]
];
const resistBeats=[
 ['長平',T('那盞燈先別滅。我要把還沒問清的事，一件一件記下。','Do not put out that light yet. I want to write down each question that remains unanswered.')],
 ['周世顯',T('紙還在。我替你壓住這一角。先從哪一件寫起？','The paper is here. I will hold this corner steady. Which question shall we write first?')],
 ['長平',T('先寫弟弟。再寫那些還沒有回家的人。名字若漏了一個，我怕往後就沒有人問了。','My brother first. Then those who have not returned home. If we miss a name, I fear no one will ask about them later.')],
 ['周世顯',T('明日的路不會容易。今晚先把傷口照看好，水也放在你手邊。','Tomorrow’s road will not be easy. Tonight, let us tend the wounds. I will leave water within your reach.')],
 ['長平',T('我知道。我不是因為不惜這條命，才往前走。正因為惜它，才不肯讓它只剩下這一夜。','I know. I do not go forward because I care little for my life. I go because I value it too much to let it become only this one night.')],
 ['落幕旁白',T('她把紙收好。夜還沒有過去，故事也沒有替她答應勝利。','She gathers the paper. The night is not over, and the story has promised her no victory.')]

const routePoems={reconcile:['半朵花還未繡完','一頁詩仍想讀完','留一盞燈等明日'],leave:['門在身後慢慢遠','鞋上有泥心有念','名字仍由自己喊'],resist:['風裡的燈先別滅','未問清的事仍在','好好活著再往前']};
const chapterNames=['候場','長平與世顯','原劇前情','回到遞表之前','親人的請求','答覆','放下今夜','庵堂的一碗粥','選擇明天','另一種後來','原劇與你','落幕'];
function button(text,fn,cls=''){const b=document.createElement('button');b.type='button';b.textContent=text;b.className=cls;b.onclick=()=>{if(!state.paused&&!state.busy)fn()};return b}

function controls(){$('header').inert=activeOverlay;$('reading').inert=state.paused||state.busy||activeOverlay;$('routeLabels').inert=state.paused||state.busy||activeOverlay;$('worldCanvas').style.pointerEvents=state.paused||state.busy?'none':'auto';$('pauseCover').hidden=!state.paused||activeOverlay;$('pause').textContent=state.paused?'繼續':'暫停';$('sound').textContent=state.sound?'聲音 開':'聲音 關';$('lang').textContent=state.english?'收起 English':'English';$('experience').classList.toggle('paused',state.paused);$('pause').disabled=activeOverlay;$('menu').disabled=state.busy}
function pair(speaker,zh,en=''){const changed=$('copy').textContent!==zh;$('speaker').textContent=speaker;$('copy').textContent=zh;$('english').textContent=en;$('english').hidden=!state.english||!en;if(changed&&state.motion){$('dialogueWrap').getAnimations().forEach(a=>a.cancel());$('dialogueWrap').animate([{opacity:.4},{opacity:1}],{duration:240,easing:'ease-out'})}}

function commit(){if(!state.pending||state.busy||state.paused)return;const v=state.pending;if(state.scene===4){soundFX('paper');stageWorld.action(v,()=>{state.petition=v;state.pending=null;state.scene=5;render()})}else{soundFX('curtain');stageWorld.action('open',()=>{state.ending=v;state.pending=null;state.scene=9;state.beat=0;state.embodied=false;render()})}}
function result(){const p=state.petition,e=state.ending;let beats=e==='reconcile'?[['長平',reconcileIntro[p]],...reconcileCommon]:e==='leave'?[['旁白',narratives.leave[p]],...leaveBeats]:[['旁白',narratives.resist[p]],...resistBeats];if(e==='leave'&&p==='submit')beats[0]=['旁白',T('親人的安葬與自由有了著落。你與世顯離開宮廷，仍記得過去，也開始學習過自己的日子。','Your family’s burial and freedom have been secured. You and Shixian leave the court, remembering the past and learning to live days of your own.')];if(e==='resist'&&p==='submit')beats=beats.map((b,i)=>i===0?['旁白',T('親人的請求獲准了。你仍不願讓其餘牽掛就此結束，與世顯繼續追問和爭取；這條路沒有勝利保證。','Your family requests were granted. You and Shixian still choose to pursue the concerns that remain. This road offers no guarantee of victory.')]:i===3?['長平',T('弟弟的自由有了著落。接著寫那些還沒有回家的人。名字若漏了一個，我怕往後就沒有人問了。','My brother’s freedom has been secured. Next, write those who have not returned home. If we miss a name, I fear no one will ask about them later.')]:b);return beats}

let projectionFitPending=false;
function fitProjection(){
 const frame=$('projectionBox'),video=$('classicVideo'),rect=$('worldBox').getBoundingClientRect();if(frame.hidden)return;
 const scale=Math.min(rect.width/1600,rect.height/900),artW=1600*scale,artH=900*scale,x=(rect.width-artW)/2,y=(rect.height-artH)/2,compare=state.scene===10;
 const border=3,topPad=Math.min(48,artH*.12),bottomPad=Math.min(35,artH*.10);

function render(){const root=$('experience');root.dataset.scene=state.scene;root.dataset.ending=state.ending||'';$('actions').replaceChildren();$('choiceStrip').replaceChildren();$('selectionReceipt').textContent='';$('homeCopy').hidden=state.scene!==0;$('routeLabels').hidden=state.scene!==8;$('routePoem').hidden=state.scene!==8||!state.pending;$('endingCaption').hidden=![9,11].includes(state.scene);$('sceneEyebrow').textContent=String(state.scene+1).padStart(2,'0')+' / '+chapterNames[state.scene];$('pastFact').textContent=fact();$('worldCue').textContent='';videoScene(state.scene===2||state.scene===10);
 const stages=['認識故事','親人的請求','放下今夜','選擇明天','另一種後來','落幕'];const idx=state.scene<4?0:state.scene<6?1:state.scene<8?2:state.scene===8?3:state.scene===9?4:5;$('progress').replaceChildren(...stages.map((t,i)=>{const e=document.createElement('span');e.textContent=t;e.className=i===idx?'active':i<idx?'done':'';return e}));
 switch(state.scene){
 case 0:pair('','','');primary('入場 · 我來飾演長平',()=>navigate(1,'curtain'));break;
 case 1:pair('你是長平','你飾演長平，一位失去故國、牽掛父皇與弟弟的公主。\n周世顯是你的未婚夫。他陪你走，不替你決定。','You play Changping, a princess who has lost her dynasty. Zhou Shixian is your betrothed. He walks beside you, but does not choose for you.');primary('先看原來的故事',()=>go(2));break;

  for(let i=0;i<count;i++){const p=petals[i],ph=(clock*speed+p.seed)%1,depth=p.depth,alpha=Math.sin(ph*Math.PI)*(depth===2?.20:.47),x=100+(i*173%1450)+(e==='leave'?ph*180:Math.sin(clock*.21+p.phase)*38),y=50+ph*725,z=(1-ph)*130;
   if(depth===0&&ph>.42){const sy=760+(i%3)*24;shadow(x+70,sy,18+z*.09,3.5+z*.015,alpha*.20*(1-z/150))}
   ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(clock*.12+p.phase);ctx.scale(p.size*(depth===2?1.8:1),p.size);ctx.fillStyle=i%2?'#f4d8da':'#de9ca8';if(depth===2)ctx.filter='blur(1.5px)';petalPath();ctx.fill();ctx.restore()}
  // Warm pools respond gently, never flicker; atmosphere remains below all text.
  if(state.scene>=9&&e==='reconcile')glow(1205,615,330,170,'#ffd5a5',.026+.008*Math.sin(clock*.24));
  if(state.scene>=9&&e==='resist')glow(1430,683,115,150,'#edac68',.04+.01*Math.sin(clock*.42));
 }
 function draw(){if(!ctx)return;ctx.save();begin();if(!ready){image('stageTexture',0,0,1600,900);ctx.restore();return}
  const n=state.scene;if(n>=9){if(n===9&&age<.9)backdrop('stageTexture');backdrop({reconcile:'reconcileTexture',leave:'leaveTexture',resist:'resistTexture'}[state.ending],n===9?Math.min(1,age/.9):1);}
  else{if(n===8&&state.pending)backdrop({reconcile:'reconcileTexture',leave:'leaveTexture',resist:'resistTexture'}[state.pending]);else backdrop('stageTexture');}
  if(n>=3&&n<=7)tableScene();lamp();atmosphere();ropes();ctx.restore();drawCount++;
 }
 function sync(){const changed=sceneBefore!==state.scene||endingBefore!==state.ending;const old=sceneBefore;sceneBefore=state.scene;endingBefore=state.ending;
  if(changed){age=old<0?5:0;Object.assign(target,{zoom:state.scene===9?1.015:1,panX:0,panY:0,ropeOpen:state.scene===9?1:0});if(state.scene===0||state.scene===3)Object.assign(target,{paperX:0,cupX:0,paperLift:0});if(old<0)Object.assign(pose,target)}
  canvas.style.cursor=state.scene===8?'grab':state.scene===4||state.scene===6?'pointer':'default';layoutText();draw();
 }
 function layoutText(){const r=plane();const labels=$('routeLabels');const nw=W<650;labels.style.left=(nw?15:r.x+r.w*.13)+'px';labels.style.top=(nw?H*.73:r.y+r.h*.72)+'px';labels.style.width=(nw?W-30:r.w*.74)+'px';labels.style.bottom='auto';const poem=$('routePoem');poem.style.top=(nw?H*.25:r.y+r.h*.26)+'px';const narrow=W<650;const home=$('homeCopy');home.style.left=(narrow?24:r.x+r.w*.075)+'px';home.style.top=(narrow?H*.21:r.y+r.h*.23)+'px';home.style.right='auto';home.style.maxWidth=(narrow?W*.70:r.w*.43)+'px';
  const ep=$('endingCaption');ep.style.left=(narrow?22:r.x+r.w*.075)+'px';ep.style.top=(narrow?H*.12:r.y+r.h*.25)+'px';ep.style.maxWidth=(narrow?W*.56:r.w*.38)+'px';ep.style.fontSize=Math.max(18,Math.min(38,r.w*.028))+'px';
 }
 function action(type,done){if(type==='cup')target.cupX=26;else if(type==='submit')target.paperX=28;else if(type==='refuse')target.paperX=-20;else if(type==='cloth')Object.assign(target,{zoom:1.045,panX:-18,panY:-10});else if(type==='leave')Object.assign(target,{zoom:1.048,panX:-24,panY:-8});else if(type==='press')Object.assign(target,{zoom:1.035,panX:-20,panY:-12});done()}
 function tick(ts){const dt=Math.max(0,Math.min(.08,(ts-last)/1000||.016));last=ts;if(!pauseFlag&&!state.paused&&!document.hidden){age+=dt;clock+=state.motion?dt:0;const d=state.motion?1-Math.exp(-dt*3.3):1;for(const k in pose)pose[k]+=Math.abs(target[k]-pose[k])<.001?target[k]-pose[k]:(target[k]-pose[k])*d;if(state.motion&&state.scene===8)ropeStep(dt);draw()}requestAnimationFrame(tick)}
 function position(e){const r=canvas.getBoundingClientRect();point.x=(e.clientX-r.left-ox)/S;point.y=(e.clientY-r.top-oy)/S;point.active=true;}
 canvas.addEventListener('pointermove',e=>{if(state.paused)return;position(e)});canvas.addEventListener('pointerdown',e=>{if(state.paused||state.scene!==8)return;position(e);point.down=true;canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing'});canvas.addEventListener('pointerup',e=>{point.down=false;canvas.style.cursor=state.scene===8?'grab':'default';if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId)});canvas.addEventListener('pointerleave',()=>{if(!point.down)point.active=false});canvas.addEventListener('pointercancel',()=>{point.active=false;point.down=false});
 canvas.addEventListener('click',e=>{if(state.paused||state.busy)return;position(e);if(state.scene===4&&point.y>270&&point.y<600&&point.x>440&&point.x<870){choose(state.pending==='submit'?'refuse':'submit')}else if(state.scene===6&&point.y>270&&point.y<560&&point.x>830&&point.x<1180)document.querySelector('#actions .primary')?.click()});
 function pause(v){pauseFlag=v}
 function diagnose(){return{ready,webgl:false,renderer:'layered-canvas-2d',scene:state.scene,pose:{...pose},target:{...target},clock,drawCount,maxShift,plane:plane(),table:state.scene>=3&&state.scene<=7}}
 Promise.all([...$('assets').querySelectorAll('img')].map(i=>i.complete&&i.naturalWidth?Promise.resolve():new Promise((ok,no)=>{i.addEventListener('load',ok,{once:true});i.addEventListener('error',no,{once:true})}))).then(()=>document.fonts.ready).then(()=>{ready=true;$('fallback').hidden=true;$('fallbackObjects').hidden=true;$('loadStatus').hidden=true;resize();sync()}).catch(()=>{$('loadStatus').textContent='部分素材未載入；文字與選擇仍可繼續。';resize()});
 createRopes();createPetals();new ResizeObserver(()=>{resize();layoutText()}).observe(box);requestAnimationFrame(tick);resize();return{sync,action,pause,diagnose,resize,plane};
